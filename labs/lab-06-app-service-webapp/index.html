<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello from Azure App Service</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 0;
           display: grid; place-items: center; min-height: 100vh;
           background: #f4f6f8; color: #1b1b1b; }
    .card { background: #fff; padding: 48px 56px; border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0,0,0,.08); text-align: center; }
    h1 { color: #0078d4; margin: 0 0 12px; }
    p  { margin: 6px 0; }
    .muted { color: #5a5a5a; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Azure App Service!</h1>
    <p>Deployed by <strong>&lt;your name&gt;</strong> — AZ-900 Lab 6</p>
    <p class="muted">Platform as a Service: Azure runs the OS, patching and web server for you.</p>
  </div>
</body>
</html>
